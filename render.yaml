services:
  - type: web
    name: neuroscan-ai
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: TF_CPP_MIN_LOG_LEVEL
        value: 3
      - key: MALLOC_ARENA_MAX
        value: 2
      - key: TF_NUM_INTRAOP_THREADS
        value: 1
      - key: TF_NUM_INTEROP_THREADS
        value: 1
      - key: OMP_NUM_THREADS
        value: 1
